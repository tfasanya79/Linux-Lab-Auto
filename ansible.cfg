[defaults]
inventory = inventory.yaml
# Set remote_user in playbook or use: ansible-playbook -u a25timfa ...
# remote_user = a25timfa
roles_path = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
become_user = root
