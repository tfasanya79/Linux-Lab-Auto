---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade packages
  ansible.builtin.apt:
    upgrade: safe

- name: Install mandatory packages (all VMs)
  ansible.builtin.apt:
    name:
      - vim
      - bind9-dnsutils
      - qemu-guest-agent
    state: present

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
